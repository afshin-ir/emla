name: Publish Afra stable release

on:
  push:
    branches:
      - feat/afra-hamburger-menu

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Afra 1.1.0 stable release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build preloaded offline database
        run: python3 android-app/scripts/build_database.py

      - name: Decode release signing key
        env:
          AFRA_KEYSTORE_BASE64: ${{ secrets.AFRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$AFRA_KEYSTORE_BASE64" || { echo "Missing AFRA_KEYSTORE_BASE64 secret" >&2; exit 1; }
          printf '%s' "$AFRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/afra-release.jks"
          chmod 600 "$RUNNER_TEMP/afra-release.jks"
          echo "AFRA_KEYSTORE_FILE=$RUNNER_TEMP/afra-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          AFRA_KEYSTORE_PASSWORD: ${{ secrets.AFRA_KEYSTORE_PASSWORD }}
          AFRA_KEY_ALIAS: ${{ secrets.AFRA_KEY_ALIAS }}
          AFRA_KEY_PASSWORD: ${{ secrets.AFRA_KEY_PASSWORD }}
        run: gradle --no-daemon -p android-app assembleRelease

      - name: Create release and upload the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Afra-1.1.0.apk"
          gh release create v1.1.0 "$RUNNER_TEMP/Afra-1.1.0.apk" \
            --repo afshin-ir/emla \
            --title "اَفرا ۱٫۱٫۰" \
            --notes-file android-app/RELEASE_NOTES_1.1.0.md \
            --target "$GITHUB_SHA"
