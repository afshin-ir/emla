name: Publish Afra Cafe Bazaar signed APK

on:
  push:
    branches:
      - feat/afra-hamburger-menu

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Bazaar-signed Afra 1.0.0 APK'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build preloaded offline database
        run: python3 android-app/scripts/build_database.py

      - name: Decode release signing key
        env:
          AFRA_KEYSTORE_BASE64: ${{ secrets.AFRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$AFRA_KEYSTORE_BASE64" || { echo "Missing AFRA_KEYSTORE_BASE64 secret" >&2; exit 1; }
          printf '%s' "$AFRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/afra-release.jks"
          chmod 600 "$RUNNER_TEMP/afra-release.jks"
          echo "AFRA_KEYSTORE_FILE=$RUNNER_TEMP/afra-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          AFRA_KEYSTORE_PASSWORD: ${{ secrets.AFRA_KEYSTORE_PASSWORD }}
          AFRA_KEY_ALIAS: ${{ secrets.AFRA_KEY_ALIAS }}
          AFRA_KEY_PASSWORD: ${{ secrets.AFRA_KEY_PASSWORD }}
        run: gradle --no-daemon -p android-app assembleRelease

      - name: Replace APK in GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Afra-1.0.0.apk"
          gh release upload v1.0.0 "$RUNNER_TEMP/Afra-1.0.0.apk" --repo afshin-ir/emla --clobber

  rtl_release_description:
    if: github.event.head_commit.message == 'Right-align Afra release notes v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set release notes direction to RTL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/afra-release-notes.html" <<'RELEASE_NOTES'
          <div dir="rtl" align="right">
          <h1>اَفرا ۱٫۰٫۰ — نخستین نسخهٔ پایدار</h1>
          <p>اَفرا یک اپلیکیشن اندرویدی برای جست‌وجوی برون‌خط در سه منبع فارسی است:</p>
          <ul>
            <li>واژگان مصوب فرهنگستان زبان و ادب فارسی، دفترهای ۱ تا ۲۰</li>
            <li>فرهنگ املایی خط فارسی</li>
            <li>دستور خط فارسی</li>
          </ul>
          <h2>قابلیت‌ها</h2>
          <ul>
            <li>جست‌وجو با واژه‌های فارسی و انگلیسی، بدون نیاز به اینترنت</li>
            <li>انتخاب منبع جست‌وجو و امکان تطبیق دقیق واژه</li>
            <li>نمایش مرتب برابرهای انگلیسی، مترادف‌ها، صورت‌های دیگر انگلیسی، حوزه‌ها، تعریف‌ها و شمارهٔ دفتر</li>
            <li>شماره‌گذاری فارسی تعریف‌های چندگانه و سامان‌دهی مدخل‌های ارجاعی</li>
            <li>کپی اطلاعات هر کارت با قالب‌بندی خوانا</li>
            <li>نگهداری جست‌وجوهای اخیر و واژه‌های نشان‌شده</li>
            <li>تنظیم اندازهٔ نوشته و نمایش با فونت وزیرمتن</li>
          </ul>
          <p>داده‌های واژگان در خود برنامه قرار دارند و جست‌وجو پس از نصب برون‌خط انجام می‌شود.</p>
          </div>
          RELEASE_NOTES
          gh release edit v1.0.0 --notes-file "$RUNNER_TEMP/afra-release-notes.html" --repo afshin-ir/emla
