<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7f4"><meta name="description" content="نسخۀ جست‌وجوپذیر دستور خط فارسی؛ شامل قواعد، مثال‌ها، توضیحات، جدول‌ها و نمایه.">
<title>دستور خط فارسی | کتابخانهٔ جست‌وجوپذیر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f7f4;--paper:#fff;--ink:#1e2d2b;--muted:#6b7b76;--line:#e1e9e4;--green:#16765d;--green-dark:#105b48;--mint:#e8f4ee;--gold:#c18a39;--shadow:0 10px 32px #213b2d0b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;line-height:1.9}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.03rem}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--green);color:white;font-size:1.3rem;box-shadow:0 6px 16px #16765d30}.toplinks{display:flex;align-items:center;gap:10px}.toplinks a{color:var(--muted);text-decoration:none;font-size:.87rem}.hero{background:linear-gradient(125deg,#143f34,#18765c 72%,#399776);color:white;border-radius:26px;padding:34px 38px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:'«»';font-weight:800;position:absolute;left:4%;top:-50px;font-size:200px;color:#ffffff0b;line-height:1}.eyebrow{font-size:.78rem;letter-spacing:.02em;color:#c5e7d7;margin:0 0 5px}.hero h1{font-size:clamp(1.6rem,3vw,2.45rem);line-height:1.5;margin:0 0 8px}.hero p{max-width:760px;color:#e0f0e8;margin:0 0 22px;font-size:.95rem}.searchbox{max-width:900px;display:flex;align-items:center;gap:12px;background:white;color:var(--ink);padding:7px 8px 7px 14px;border-radius:15px;box-shadow:0 9px 30px #092e2226;position:relative;z-index:1}.search-icon{font-size:1.25rem;color:var(--green);padding:0 10px}.searchbox input{width:100%;border:0;outline:0;padding:10px 0;color:var(--ink);font-size:1rem;min-width:0}.searchbox input::placeholder{color:#95a39e}.kbd{border:1px solid var(--line);border-radius:6px;color:#82918b;font-size:.74rem;white-space:nowrap;padding:1px 7px;direction:ltr}.clear{border:0;background:#f0f4f1;border-radius:9px;padding:6px 11px;color:#53635d;display:none}.searchbox.has-value .clear{display:block}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px;position:relative;z-index:1}.stat{font-size:.78rem;border:1px solid #ffffff35;background:#ffffff12;border-radius:999px;padding:4px 11px;color:#eef8f2}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}.side,.reader{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{position:sticky;top:16px;padding:19px 14px;max-height:calc(100vh - 32px);overflow:auto}.side-title{font-weight:700;font-size:.93rem;padding:0 10px 10px}.nav-list{display:grid;gap:4px}.nav-item{border:0;background:transparent;text-align:right;width:100%;padding:9px 11px;border-radius:10px;color:#52625c;font-size:.84rem;line-height:1.6}.nav-item:hover{background:#f3f7f4;color:var(--green)}.nav-item.active{background:var(--mint);color:var(--green-dark);font-weight:700}.nav-num{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:7px;border-radius:7px;background:#edf1ee;color:#708078;font-size:.72rem;vertical-align:middle}.nav-item.active .nav-num{background:#d3eade;color:var(--green-dark)}.reader{min-height:600px;padding:clamp(20px,4vw,42px)}.reader-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}.reader-kicker{color:var(--green);font-size:.78rem;font-weight:700;margin:0}.reader h2{font-size:1.65rem;line-height:1.5;margin:3px 0 0}.reader-meta{white-space:nowrap;color:var(--muted);font-size:.76rem;padding-top:8px}.reader-content p{margin:0 0 14px;line-height:2.15;white-space:pre-wrap}.reader-content h3{font-size:1.12rem;color:var(--green-dark);margin:28px 0 12px;padding-right:12px;border-right:3px solid #8bc1a5;line-height:1.7}.book-table-wrap{overflow:auto;margin:18px 0 24px;border:1px solid var(--line);border-radius:12px}.book-table{border-collapse:collapse;width:100%;min-width:420px;font-size:.87rem;line-height:1.8}.book-table td{padding:10px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top}.book-table tr:nth-child(odd){background:#f8faf8}.book-table tr:first-child{font-weight:700;background:#edf5ef}.book-table tr:last-child td{border-bottom:0}.block{scroll-margin-top:24px}.search-panel{display:none}.search-panel.visible{display:block}.search-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.search-title{font-size:1rem;font-weight:700;margin:0}.search-count{font-size:.8rem;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:5px 12px;color:#63736c;font-size:.78rem}.filter.active{border-color:#b6d8c6;background:var(--mint);color:var(--green-dark);font-weight:700}.results{display:grid;gap:10px}.result{border:1px solid var(--line);border-radius:13px;padding:14px 16px;transition:border-color .15s,transform .15s;cursor:pointer}.result:hover{border-color:#9bc7ae;transform:translateY(-1px)}.result-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}.result-section{font-weight:700;color:var(--green-dark);font-size:.9rem}.badge{font-size:.68rem;border-radius:999px;padding:1px 8px;background:#f0f3f1;color:#718079}.result-snippet{margin:0;color:#586861;font-size:.84rem;line-height:1.9;overflow-wrap:anywhere}.result-quote{margin:10px 0 0;padding:12px 15px;border-right:3px solid #8bc1a5;background:#f8faf8;border-radius:9px;color:#34443e;font-size:.91rem;line-height:2.05;white-space:pre-wrap}.result-citation{margin-top:10px;padding-top:8px;border-top:1px solid #edf1ee;color:#587267;font-size:.76rem;line-height:1.9}.result-citation strong{color:var(--green-dark)}.citation-link{border:0;background:transparent;color:var(--green);text-decoration:underline;text-underline-offset:3px;padding:0 3px;font:inherit;cursor:pointer}.index-summary{border:1px solid #dbe9df;background:#f4faf6;border-radius:13px;padding:13px 16px;margin:0 0 14px}.index-summary strong{color:var(--green-dark)}.index-summary p{margin:3px 0 0;color:#586861;font-size:.82rem;line-height:1.9}.source-note{display:block;margin-top:6px;color:#7b8983;font-size:.72rem}.result mark{background:#fcebbf;color:#5a4519;border-radius:3px;padding:0 2px}.empty{padding:35px 15px;text-align:center;color:var(--muted);background:#f8faf8;border-radius:13px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.welcome{border:1px solid #e2ece5;background:#f8fbf8;padding:17px 19px;border-radius:14px;margin-bottom:22px;color:#53635c}.welcome strong{color:var(--green-dark)}.welcome ul{margin:7px 0 0;padding-right:20px}.welcome li{margin:3px 0}.footer{color:#83918b;text-align:center;font-size:.75rem;padding:22px 0 6px}.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#183f34;color:white;border-radius:10px;padding:9px 15px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.nav-list{grid-template-columns:repeat(2,minmax(0,1fr))}.reader{min-height:0}}@media(max-width:580px){.shell{padding:13px}.topbar{margin:2px 2px 14px}.toplinks a{font-size:.76rem}.hero{padding:24px 18px;border-radius:20px}.hero p{font-size:.86rem}.kbd{display:none}.layout{gap:12px;margin-top:12px}.side{padding:13px 10px;border-radius:16px}.nav-list{grid-template-columns:1fr}.nav-item{padding:7px 9px}.reader{border-radius:16px;padding:20px 16px}.reader h2{font-size:1.35rem}.reader-meta{display:none}.result{padding:12px}.stats{gap:6px}.stat{font-size:.7rem}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">ا</span><span>کتابخانهٔ دستور خط فارسی</span></div><nav class="toplinks" aria-label="پیوندها"><a href="https://github.com/afshin-ir/emla" target="_blank" rel="noreferrer">مخزن در GitHub ↗</a></nav></header>
<section class="hero" aria-labelledby="hero-title"><p class="eyebrow">فرهنگستان زبان و ادب فارسی</p><h1 id="hero-title">دستور خط فارسی</h1><p>قواعد، توضیحات، مثال‌ها و جدول‌های کتاب را یک‌جا بخوانید و در متن کامل آن جست‌وجو کنید.</p><form class="searchbox" id="search-form" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="query" type="search" autocomplete="off" aria-label="جست‌وجو در کتاب" placeholder="مثلاً نیم‌فاصله، همزه، کسرۀ اضافه یا یک مثال…"><span class="kbd">/</span><button class="clear" id="clear" type="button" aria-label="پاک کردن جست‌وجو">پاک‌کردن</button></form><div class="stats" id="stats" aria-live="polite"></div></section>
<div class="layout"><aside class="side" aria-label="فهرست فصل‌ها"><div class="side-title">فصل‌های کتاب</div><nav id="toc" class="nav-list"></nav></aside><main class="reader"><section class="search-panel" id="search-panel" aria-live="polite"><div class="search-head"><h2 class="search-title">نتایج جست‌وجو</h2><span class="search-count" id="search-count"></span></div><div class="filters" id="filters" aria-label="محدود کردن نوع نتیجه"></div><div class="results" id="results"></div></section><section id="book-view"><div class="loading">در حال آماده‌سازی متن کتاب…</div></section></main></div>
<footer class="footer">نسخۀ دیجیتال و جست‌وجوپذیرِ متن کتاب دستور خط فارسی</footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),toc=$('#toc'),bookView=$('#book-view'),panel=$('#search-panel'),input=$('#query'),results=$('#results'),filtersEl=$('#filters');let book,sections=[],indexEntries=[],activeSection='',filter='همه',debounce;
const normal=s=>mapped(s).text;function mapped(value){const raw=String(value||'');let text='',map=[];for(let i=0;i<raw.length;){const cp=raw.codePointAt(i),ch=String.fromCodePoint(cp),len=ch.length;let piece=ch.normalize('NFKC').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ۀة]/g,'ه').replace(/[ؤ]/g,'و').replace(/[أإٱ]/g,'ا').replace(/[ـ\u200c\u200d\u200e\u200f\u064b-\u065f\u0670]/g,' ').replace(/[\u200c\u200d]/g,' ').toLowerCase();for(const c of piece){if(/\s/.test(c)){if(text&&text[text.length-1]!==' '){text+=' ';map.push(i)}}else{text+=c;map.push(i)}}i+=len}if(text.endsWith(' ')){text=text.slice(0,-1);map.pop()}return{text,map,raw}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function typeOf(b){if(b.kind==='table')return'جدول';if(/مثال|مانند|ازجمله|از جمله|نظیر|شاهد/.test(normal(b.text)))return'مثال';return'قاعده و توضیح'}
function makeSections(){const map=new Map();for(const b of book.blocks){const key=b.section||'آغاز کتاب';if(!map.has(key))map.set(key,[]);map.get(key).push(b)}sections=[...map].map(([title,blocks],i)=>({title,blocks,id:(blocks.find(x=>x.kind==='heading')||blocks[0]).id,num:i+1}));}
function buildIndex(){indexEntries=[];const pattern=/\s([۰-۹\d]+(?:\s*[-–]\s*[۰-۹\d]+)?(?:\s*[،,]\s*[۰-۹\d]+(?:\s*[-–]\s*[۰-۹\d]+)?)*)$/u;for(const b of book.blocks){if(b.section!=='نمایه'||b.kind!=='paragraph')continue;const raw=b.text.replace(/\s*\(نیز نک\..*$/,'').trim(),m=raw.match(pattern);if(!m)continue;const label=raw.slice(0,m.index).trim();if(label)indexEntries.push({label,norm:normal(label),pages:m[1].replace(/\s+/g,' '),id:b.id})}}
function indexMatches(q,tokens){const n=normal(q);return indexEntries.filter(e=>e.norm===n||(tokens.length>0&&tokens.every(t=>e.norm.includes(t)))).sort((a,b)=>(a.norm===n?-1:0)-(b.norm===n?-1:0)||a.norm.length-b.norm.length).slice(0,5)}
function citationsFor(b,direct,terms){let pages=[];if(b.kind==='table'){const rows=b.rows.map((row,i)=>({row,i})).filter(x=>terms.every(t=>normal(x.row.join(' ؛ ')).includes(t)));for(const x of rows)pages.push(...(b.rowPages?.[x.i]||[]));if(!pages.length)pages.push(...(b.pages||[]))}else pages=b.pages||[];pages=[...new Set(pages)].filter(Boolean).sort((a,b)=>a-b);let entries=[];if(!pages.length){entries=direct.length?direct:indexEntries.filter(e=>e.norm.length>3&&normal(b.text||'').includes(e.norm)).sort((a,b)=>b.norm.length-a.norm.length).slice(0,2)}return{pages,entries}}
function citationMarkup(cite){let out='';if(cite.pages.length)out+=`<strong>صفحهٔ متن نقل‌شده:</strong> ${cite.pages.map(p=>`ص. ${fa(p)}`).join('، ')}`;if(cite.entries.length)out+=`${out?' <span aria-hidden="true">؛</span> ':''}<strong>ارجاع نمایۀ کتاب:</strong> ${cite.entries.map(e=>`<button class="citation-link" type="button" data-index-id="${esc(e.id)}">${esc(e.label)}، ص. ${fa(e.pages)}</button>`).join(' ؛ ')}`;if(!out)out='<strong>ارجاع صفحه:</strong> برای این بند شمارهٔ صفحهٔ قابل‌اتکا پیدا نشد.';return `<div class="result-citation">${out}<span class="source-note">متن نقل‌شده از کتاب است؛ شماره‌ها، صفحه‌های چاپی کتاب‌اند.</span></div>`}
function renderTOC(){toc.innerHTML=sections.map((s,i)=>`<button class="nav-item${s.title===activeSection?' active':''}" data-section="${esc(s.title)}"><span class="nav-num">${fa(i+1)}</span>${esc(s.title)}</button>`).join('');toc.querySelectorAll('button').forEach(b=>b.onclick=()=>showSection(b.dataset.section,true));}
function fa(n){return String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace(/[٠-٩]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d.charCodeAt(0)-1632])}
function renderSection(title,focusId){const s=sections.find(x=>x.title===title)||sections[0];if(!s)return;activeSection=s.title;panel.classList.remove('visible');bookView.style.display='block';bookView.innerHTML=`<div class="reader-head"><div><p class="reader-kicker">دستور خط فارسی</p><h2>${esc(s.title)}</h2></div><span class="reader-meta">فصل ${fa(s.num)} از ${fa(sections.length)}</span></div><div class="reader-content">${s.blocks.map((b,i)=>b.kind==='heading'?`<h3 class="block" id="${esc(b.id)}">${esc(b.text)}</h3>`:b.kind==='table'?`<div class="book-table-wrap block" id="${esc(b.id)}"><table class="book-table"><tbody>${b.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class="block" id="${esc(b.id)}">${esc(b.text)}</p>`).join('')}</div>`;renderTOC();if(focusId){requestAnimationFrame(()=>{const target=document.getElementById(focusId);if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.animate([{backgroundColor:'#fff2c9'},{backgroundColor:'transparent'}],{duration:1500})}})}else $('.reader').scrollIntoView({behavior:'smooth',block:'start'});}
function showSection(title,scroll){renderSection(title);if(scroll)history.replaceState(null,'','#'+encodeURIComponent(sections.find(x=>x.title===title)?.id||''))}
function highlight(text,terms){const m=mapped(text),ranges=[];for(const term of terms){let at=m.text.indexOf(term);while(at>=0){const from=m.map[at],to=(m.map[at+term.length]??text.length);ranges.push([from,to]);at=m.text.indexOf(term,at+term.length)}}if(!ranges.length)return esc(text);ranges.sort((a,b)=>a[0]-b[0]);let out='',pos=0;for(const [a,b] of ranges){if(a<pos)continue;out+=esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';pos=b}return out+esc(text.slice(pos))}
function fullTextResult(b,terms){if(b.kind==='table'){const rows=b.rows.filter(row=>terms.every(t=>normal(row.join(' ؛ ')).includes(t)));const shown=rows.length?rows:b.rows;return `<div class=\"book-table-wrap\"><table class=\"book-table\"><tbody>${shown.map(row=>`<tr>${row.map(cell=>`<td>${highlight(cell,terms)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}return `<blockquote class=\"result-quote\">${highlight(b.text||'',terms)}</blockquote>`}
function score(b,q,tokens){const txt=normal(b.text),title=normal(b.section);let n=0;if(txt.includes(q))n+=20;if(title.includes(q))n+=10;for(const t of tokens){if(txt.includes(t))n+=3;if(title.includes(t))n+=2}return n}
function search(){clearTimeout(debounce);debounce=setTimeout(runSearch,80)}function runSearch(){const q=normal(input.value);$('.searchbox').classList.toggle('has-value',!!q);if(!q){panel.classList.remove('visible');bookView.style.display='block';return}panel.classList.add('visible');bookView.style.display='none';const tokens=q.split(' ').filter(x=>x.length>1);const direct=indexMatches(q,tokens);const hits=book.blocks.map((b,i)=>({b,i,sc:score(b,q,tokens)})).filter(x=>x.b.section!=='نمایه'&&x.sc>0&&tokens.every(t=>normal(x.b.text).includes(t)||normal(x.b.section).includes(t))).filter(x=>filter==='همه'||typeOf(x.b)===filter).sort((a,b)=>b.sc-a.sc||a.i-b.i).slice(0,100);$('#search-count').textContent=`${fa(hits.length)} متن کامل${hits.length===100?' یا بیشتر':''}`;const summary=direct.length?`<div class=\"index-summary\"><strong>ارجاع صفحه در نمایۀ کتاب</strong><p>${direct.map(e=>`${esc(e.label)}: صفحۀ ${fa(e.pages)}`).join(' ؛ ')}</p><span class=\"source-note\">این شماره‌ها از نمایۀ چاپی کتاب برداشته شده‌اند.</span></div>`:'';if(!hits.length){results.innerHTML=summary+'<div class=\"empty\"><strong>نتیجه‌ای پیدا نشد</strong>املای دیگری را امتحان کنید یا فیلتر را روی «همه» بگذارید.</div>';return}results.innerHTML=summary+hits.map(({b})=>{const cites=citationsFor(b,direct,tokens);return `<article class=\"result\" tabindex=\"0\" role=\"link\" data-section=\"${esc(b.section)}\" data-id=\"${esc(b.id)}\"><div class=\"result-top\"><span class=\"result-section\">${esc(b.section)}</span><span class=\"badge\">${typeOf(b)}</span><span class=\"badge\">متن کامل کتاب</span></div>${fullTextResult(b,tokens)}${citationMarkup(cites)}</article>`}).join('');results.querySelectorAll('.result').forEach(el=>{const go=()=>{panel.classList.remove('visible');bookView.style.display='block';renderSection(el.dataset.section,el.dataset.id);history.replaceState(null,'','#'+encodeURIComponent(el.dataset.id))};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});results.querySelectorAll('.citation-link').forEach(link=>link.onclick=e=>{e.stopPropagation();const target=indexEntries.find(x=>x.id===link.dataset.indexId);if(target){renderSection('نمایه',target.id);history.replaceState(null,'','#'+encodeURIComponent(target.id))}})}
function renderFilters(){const opts=['همه','قاعده و توضیح','مثال','جدول'];filtersEl.innerHTML=opts.map(x=>`<button class="filter${filter===x?' active':''}" data-filter="${x}">${x}</button>`).join('');filtersEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();runSearch()})}
input.addEventListener('input',search);$('#search-form').addEventListener('submit',e=>{e.preventDefault();runSearch()});$('#clear').onclick=()=>{input.value='';search();input.focus()};document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();input.focus()}if(e.key==='Escape'&&document.activeElement===input){input.value='';search();input.blur()}});
fetch('./book.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(data=>{book=data;makeSections();buildIndex();activeSection=sections[0]?.title;$('#stats').innerHTML=`<span class="stat">${fa(sections.length)} فصل</span><span class="stat">${fa(book.blocks.filter(x=>x.kind==='paragraph').length)} بند</span><span class="stat">${fa(book.blocks.filter(x=>x.kind==='table').length)} جدول</span><span class="stat">جست‌وجو در متن کامل و نمایه</span>`;renderFilters();renderSection(activeSection);const hash=decodeURIComponent(location.hash.slice(1));if(hash){const b=book.blocks.find(x=>x.id===hash);if(b)renderSection(b.section,hash)}}).catch(()=>bookView.innerHTML='<div class="empty"><strong>بارگذاری کتاب انجام نشد</strong>فایل book.json را کنار این صفحه قرار دهید و صفحه را دوباره بارگیری کنید.</div>');})();
</script>
</body></html>
