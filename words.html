 <main class="paper">
  <section class="intro cover-intro"><div class="intro-copy"><div><h1>واژگان مصوب فرهنگستان</h1><p>جست‌وجو در واژه‌ها، برابرهای انگلیسی، حوزه‌ها، تعریف‌ها و یادداشت‌های دفترهای ۱ تا ۲۰.</p></div></div><a class="cover-link" href="./assets/approved-words-cover.jpg" aria-label="نمایش تصویر جلد در اندازۀ اصلی"><img class="cover-image" src="./assets/approved-words-cover.jpg" alt="جلد فرهنگ واژه‌های مصوب فرهنگستان، دفتر بیستم" loading="eager" decoding="async"></a></section>

<dialog class="reading-dialog" id="reading-settings-dialog" aria-labelledby="reading-settings-title"><div class="reading-dialog-head"><strong id="reading-settings-title">تنظیمات خواندن</strong><button class="reading-dialog-close" id="reading-settings-close" type="button" aria-label="بستن">×</button></div><label class="reading-setting-row">اندازۀ نوشته <input id="reading-font-size" type="range" min="0.9" max="1.3" step="0.05"><output id="reading-font-size-value"></output></label><label class="reading-setting-row">فاصلۀ سطرها <input id="reading-line-height" type="range" min="1.7" max="2.7" step="0.1"><output id="reading-line-height-value"></output></label><label class="reading-setting-row reading-setting-check"><input id="reading-dark-mode" type="checkbox"> حالت تیره</label><div class="reading-dialog-actions"><button class="reading-dialog-primary" id="reading-settings-done" type="button">انجام شد</button></div></dialog>
<script>
(()=>{
const $=id=>document.getElementById(id),q=$("query"),volume=$("volume"),subject=$("subject"),exactOnly=$("exact-only"),results=$("results"),pageText=$("page"),prev=$("prev"),next=$("next");
const READING_SETTINGS_KEY="emla-reading-settings-v1";
function getReadingSettings(){const value={scale:1,leading:2.15,dark:false};try{Object.assign(value,JSON.parse(localStorage.getItem(READING_SETTINGS_KEY)||"{}"));if(!localStorage.getItem(READING_SETTINGS_KEY))value.dark=localStorage.getItem("words20-preview-theme")==="dark";}catch{}return value;}
function applyReadingSettings(){const value=getReadingSettings();document.documentElement.style.setProperty("--reading-scale",String(value.scale));document.documentElement.style.setProperty("--reading-leading",String(value.leading));document.body.dataset.theme=value.dark?"dark":"light";$("reading-font-size").value=value.scale;$("reading-line-height").value=value.leading;$("reading-dark-mode").checked=!!value.dark;$("reading-font-size-value").textContent=Math.round(value.scale*100)+"٪";$("reading-line-height-value").textContent=Number(value.leading).toFixed(1);}
function saveReadingSettings(){const value={scale:Number($("reading-font-size").value),leading:Number($("reading-line-height").value),dark:$("reading-dark-mode").checked};try{localStorage.setItem(READING_SETTINGS_KEY,JSON.stringify(value));localStorage.setItem("words20-preview-theme",value.dark?"dark":"light");}catch{}applyReadingSettings();}
$("reading-settings-open").addEventListener("click",()=>{$("reading-settings-dialog").showModal();});
$("reading-settings-close").addEventListener("click",()=>$("reading-settings-dialog").close());
$("reading-settings-done").addEventListener("click",()=>$("reading-settings-dialog").close());
$("reading-font-size").addEventListener("input",saveReadingSettings);$("reading-line-height").addEventListener("input",saveReadingSettings);$("reading-dark-mode").addEventListener("change",saveReadingSettings);
$("reading-settings-dialog").addEventListener("click",event=>{if(event.target===$("reading-settings-dialog"))$("reading-settings-dialog").close();});
const fa=n=>Number(n||0).toLocaleString("fa-IR"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function refreshSiteBookmarkCount(){try{const saved=JSON.parse(localStorage.getItem("emla-bookmarks-v1")||"[]");$("bookmark-count").textContent=fa(Array.isArray(saved)?saved.length:0)}catch{$("bookmark-count").textContent="۰"}}refreshSiteBookmarkCount();window.addEventListener("storage",event=>{if(event.key==="emla-bookmarks-v1")refreshSiteBookmarkCount()});
const normalize=s=>String(s??"").normalize("NFKC").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[ۀة]/g,"ه").replace(/[\u064b-\u065f\u0670ـ]/g,"").toLowerCase().replace(/[^\p{L}\p{N}_]/gu,"");
let indexedBases=new Set();
const stripIndex=s=>{const raw=String(s??"").trim(),m=raw.match(/^(.*?)(\s*[0-9۰-۹٠-٩]+)$/u);if(!m)return raw;const base=m[1].trim();return /\s[0-9۰-۹٠-٩]+$/u.test(raw)||indexedBases.has(normalize(base))?base:raw;};
const displayEnglish=s=>String(s??"").split(/[,،;؛]/).map(x=>stripIndex(x)).filter(Boolean).join(", ");
let page=0,total=0,groups={},ready=false,requestId=0,timer=0,shownRows=[],subjectLabels={};
const worker=new Worker(new URL("./words-new-worker.js?v=single-gzip-12",location.href));
const persianDigits="۰۱۲۳۴۵۶۷۸۹";
const toPersianDigits=value=>String(value??"").replace(/[0-9٠-٩۰-۹]/gu,d=>persianDigits[d>="0"&&d<="9"?d.charCodeAt(0)-48:d>="٠"&&d<="٩"?d.charCodeAt(0)-0x0660:d.charCodeAt(0)-0x06f0]);
const numberValue=value=>Array.from(String(value??"")).reduce((sum,d)=>sum*10+(d>="0"&&d<="9"?d.charCodeAt(0)-48:d>="٠"&&d<="٩"?d.charCodeAt(0)-0x0660:d.charCodeAt(0)-0x06f0),0);
function formatDefinitionText(value){
 let text=String(value??"").replace(/(?<=[\p{L}\p{M}])ـ+(?=[\p{L}\p{M}])/gu,"");
 const markerPattern=/(^|\s)([0-9٠-٩۰-۹]+)([.)])(?=\s)/gu;
 const markers=[...text.matchAll(markerPattern)],sequenceStarts=new Set();
 if(markers.length>1&&text.slice(0,markers[0].index).trim()===""&&numberValue(markers[0][2])===1){
  let expected=2;
  for(const marker of markers.slice(1)){if(numberValue(marker[2])!==expected)break;sequenceStarts.add(marker.index);expected++;}
 }
 if(sequenceStarts.size)text=text.replace(markerPattern,(match,space,number,punctuation,index)=>(sequenceStarts.has(index)?"\n":space)+toPersianDigits(number)+punctuation);
 text=text.replace(/(^|\n)([ \t]*)([0-9٠-٩۰-۹]+)([.)])(?=\s)/gu,(_,line,space,number,punctuation)=>line+space+toPersianDigits(number)+punctuation);
 const hasPersian=value=>/[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]/u.test(value);
 for(const [pattern,open,close] of [[/“([^”\n]*)”/gu,"«","»"],[/"([^"\n]*)"/gu,"«","»"],[/‘([^’\n]*)’/gu,"«","»"],[/'([^'\n]*)'/gu,"«","»"]]){
  text=text.replace(pattern,(match,inside)=>hasPersian(inside)?open+inside+close:match);
 }
 return text;
}
function highlightedDefinition(value,query){
 const normalizedQuery=String(query??"").replace(/[0-9٠-٩۰-۹]/gu,d=>persianDigits[d>="0"&&d<="9"?d.charCodeAt(0)-48:d>="٠"&&d<="٩"?d.charCodeAt(0)-0x0660:d.charCodeAt(0)-0x06f0]);
 return highlighted(formatDefinitionText(value),normalizedQuery);
}
function highlighted(value,query){
 const text=String(value??""),terms=[...new Set(stripIndex(query).split(/\s+/).map(normalize).filter(t=>t.length>1))];if(!terms.length)return esc(text);
 let folded="",positions=[],offset=0;for(const ch of text){const f=normalize(ch);for(const unit of Array.from(f)){folded+=unit;positions.push([offset,offset+ch.length]);}offset+=ch.length;}
 let spans=[];for(const term of terms){let start=0,index;while((index=folded.indexOf(term,start))!==-1){const a=positions[index]?.[0],b=positions[index+term.length-1]?.[1];if(a!==undefined&&b!==undefined)spans.push([a,b]);start=index+term.length;}}
 spans=spans.map(([a,b])=>{if(!/\p{Script=Arabic}/u.test(text.slice(a,b)))return[a,b];const l=text.slice(0,a).match(/[\p{L}\p{M}\p{N}_\u200c]+$/u)?.[0].length||0,r=text.slice(b).match(/^[\p{L}\p{M}\p{N}_\u200c]+/u)?.[0].length||0;return[a-l,b+r];});
 spans.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const merged=[];for(const s of spans){const p=merged[merged.length-1];if(p&&s[0]<=p[1])p[1]=Math.max(p[1],s[1]);else merged.push(s.slice());}
 const format=s=>{const re=/[A-Za-z][A-Za-z0-9]*(?:[ -][A-Za-z0-9]+)*/g;let out="",last=0,m;while((m=re.exec(s))!==null){out+=esc(s.slice(last,m.index))+"<code class=\"latin\" lang=\"en\" dir=\"ltr\">"+esc(m[0])+"</code>";last=m.index+m[0].length;}return out+esc(s.slice(last));};
 const latinGroups=[],covered=new Set(),latinTokens=/[A-Za-z][A-Za-z0-9]*/g;let token;
 while((token=latinTokens.exec(text))!==null){
  const a=token.index,b=a+token[0].length,hits=merged.filter(([x,y])=>x>=a&&y<=b);
  if(hits.length){latinGroups.push({a,b,hits});for(const hit of hits)covered.add(hit);}
 }
 const blocks=latinGroups.map(group=>({...group,type:"latin"})).concat(merged.filter(span=>!covered.has(span)).map(([a,b])=>({a,b,type:"mark"}))).sort((a,b)=>a.a-b.a||a.b-b.b);
 let out="",last=0;
 for(const block of blocks){
  out+=format(text.slice(last,block.a));
  if(block.type==="latin"){
   let inner="",cursor=block.a;
   for(const[a,b]of block.hits){inner+=esc(text.slice(cursor,a))+"<mark>"+esc(text.slice(a,b))+"</mark>";cursor=b;}
   inner+=esc(text.slice(cursor,block.b));
   out+="<code class=\"latin\" lang=\"en\" dir=\"ltr\">"+inner+"</code>";
  }else out+="<mark>"+format(text.slice(block.a,block.b))+"</mark>";
  last=block.b;
 }
 return out+format(text.slice(last));
}
function makeExcerpt(text,query,max=240){
 const chars=Array.from(String(text??""));if(chars.length<=max)return {text:chars.join(""),more:false};
 const terms=stripIndex(query).split(/\s+/).map(normalize).filter(Boolean);let folded="",map=[];
 chars.forEach((ch,i)=>{for(const c of Array.from(normalize(ch))){folded+=c;map.push(i);}});
 let at=-1;for(const t of terms){if(t.length>1){at=folded.indexOf(t);if(at>=0)break;}}
 if(at<0)return{text:chars.slice(0,max).join(""),more:true};
 const hit=map[at]??0,start=Math.max(0,hit-75),end=Math.min(chars.length,start+max);return{text:(start?"…":"")+chars.slice(start,end).join("")+(end<chars.length?"…":""),more:true};
}
function splitSynonyms(text){
 const raw=String(text??""),marker=/متـ?\s*\.\s*/gu,matches=[...raw.matchAll(marker)];if(!matches.length)return{definition:raw.trim(),synonyms:""};
 const definition=raw.slice(0,matches[0].index).trim(),synonyms=[];for(let i=0;i<matches.length;i++){const st=matches[i].index+matches[i][0].length,en=i+1<matches.length?matches[i+1].index:raw.length;const part=raw.slice(st,en).trim();if(part)synonyms.push(part);}return{definition,synonyms:synonyms.join("، ")};
}
function detail(label,value,cls=""){return value?"<div class=\"detail "+cls+"\"><span class=\"detail-label\">"+label+"</span><span class=\"detail-text\">"+value+"</span></div>":"";}
function volumeLabel(list){const vals=(list||[]).map(fa);return vals.length===1?"دفتر "+vals[0]:vals.length>1?"دفترهای "+vals.slice(0,-1).join("، ")+" و "+vals.at(-1):"";}
function parseRef(value){const t=String(value||"").trim();return /^←/.test(t)?t.replace(/^←\s*/,""):"";}
function detailsMarkup(e,query,type){
 const parts=splitSynonyms(e[4]);let html="";
 if(parts.definition){const isReference=/^\s*←/u.test(parts.definition),rawDefinition=isReference?parts.definition.replace(/^\s*←\s*/u,""):parts.definition,formattedDefinition=formatDefinitionText(rawDefinition),ex=makeExcerpt(formattedDefinition,query),label=isReference?"ارجاع به:":"تعریف:";html+="<div class=\"detail\"><span class=\"detail-label\">"+label+"</span><div class=\"detail-text definition-text\"><p class=\"definition-preview\">"+highlightedDefinition(ex.text,query)+"</p>"+(ex.more?"<details class=\"definition-more\"><summary></summary><p class=\"definition-full\">"+highlightedDefinition(formattedDefinition,query)+"</p></details>":"")+"</div></div>";}
 const visibleTerms=e._displayWordTerms||[];
 const hiddenTerms=e._hiddenWordTerms||[];
 const synonyms=englishTerms(parts.synonyms).map(stripIndex).filter(term=>!visibleTerms.some(word=>normalize(word)===normalize(term))&&!hiddenTerms.includes(normalize(term)));
 if(synonyms.length)html+=detail("مترادف:",highlighted(synonyms.join("، "),query),"synonym-detail");
 const books=volumeLabel(e[7]);if(books)html+=detail("منبع:",esc(books),"source-detail");
 if(e[8])html+="<details class=\"note-more\"><summary>دیدن یادداشت دفتر</summary><div style=\"white-space:pre-line\">"+highlighted(e[8],query)+"</div></details>";
 return html;
}
function englishTerms(s){return String(s||"").split(/[,،;؛]/).map(x=>x.trim()).filter(Boolean);}
function domainTerms(value){
 let raw=String(value??"").replace(/[\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]/gu,"").trim();
 raw=raw.replace(/^\[+|\]+$/gu,"").trim();
 const terms=[];
 for(const part of raw.split(/[,،;؛]/u)){
  const term=part.replace(/[\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]/gu,"").replace(/\u200c+$/gu,"").trim().replace(/^[\[\]]+|[\[\]]+$/gu,"").trim();
  if(!term||term.startsWith("←"))continue;
  if(term==="شیمی م. شیمی"){terms.push("شیمی","م. شیمی");continue;}
  terms.push(term);
 }
 return [...new Set(terms)];
}
function card(e,query,isEnglish,matchType,grouped=false){
 const word=(e._displayWordTerms||visiblePersianTerms(e[0])).join("، "),english=englishTerms(e[3]),mainEnglish=isEnglish&&english.length?displayEnglish(english[0]):"";
 const badge=matchType==="reference"?"<span class=\"match-badge reference\">پیداشده از راه سرنام یا ارجاع</span>":matchType==="details"?"<span class=\"match-badge details\">تطبیق در اطلاعات مدخل</span>":"";
 let head="";
 if(grouped){
  head=word?"<h3 lang=\"fa\" dir=\"rtl\">"+highlighted(word,query)+"</h3>":"<div class=\"persian-under\">برابر فارسی در این سطر ثبت نشده است</div>";
  const alternatives=english.filter(t=>normalize(stripIndex(t))!==normalize(stripIndex(query)));
  if(alternatives.length)head+="<div class=\"secondary-english\"><span class=\"secondary-english-label\">مدخل‌های انگلیسیِ دیگر برای این برابر:</span><span class=\"english-code\">"+highlighted(alternatives.map(stripIndex).join(", "),query)+"</span></div>";
 }else if(mainEnglish){
  head="<h2 class=\"english-primary\" lang=\"en\" dir=\"ltr\"><code>"+highlighted(mainEnglish,query)+"</code></h2>"+(word?"<div class=\"persian-under\"><span class=\"term-label\">برابر فارسی:</span>"+highlighted(word,query)+"</div>":"<span class=\"term-label\">مدخل انگلیسی؛ برابر فارسی در این سطر ثبت نشده است</span>");
  const alternatives=english.slice(1).map(stripIndex).filter(Boolean);
  if(alternatives.length)head+="<div class=\"secondary-english\"><span class=\"secondary-english-label\">صورت‌های دیگر انگلیسی:</span><span class=\"english-code\">"+highlighted(alternatives.join(", "),query)+"</span></div>";
 }else{
  const title=word||displayEnglish(english[0]||e[3])||"مدخل بدون عنوان";head="<h2>"+highlighted(title,query)+"</h2>";
  if(english.length){
   head+="<div class=\"secondary-english\"><span class=\"secondary-english-label\">برابر انگلیسی:</span><span class=\"english-code\">"+highlighted(displayEnglish(english[0]),query)+"</span></div>";
   const alternatives=english.slice(1).map(stripIndex).filter(Boolean);
   if(alternatives.length)head+="<div class=\"secondary-english\"><span class=\"secondary-english-label\">صورت‌های دیگر انگلیسی:</span><span class=\"english-code\">"+highlighted(alternatives.join(", "),query)+"</span></div>";
  }
 }
 const domain=domainTerms(e[2]).map(term=>"<button class=\"domain-filter-link\" type=\"button\" data-domain=\""+esc(term)+"\" title=\"نمایش مدخل‌های این حوزه\">"+highlighted(subjectLabels[term]||term,query)+"</button>").join("، ");
 const body=detailsMarkup(e,query,matchType);
 return "<article class=\"item\">"+badge+"<div class=\"item-head\"><div>"+head+"</div></div><div class=\"details\">"+detail("حوزه:",domain,"domain-detail")+body+"</div></article>";
}
function groupExact(items,query,isEnglish){
 return items.map(r=>card(r.entry,query,isEnglish,r.matchType)).join("");
}
function render(message){
 total=message.total;page=message.page;groups=message.groups||{};shownRows=message.rows||[];
 const query=q.value.trim(),isEnglish=/[A-Za-z]/.test(query)&&!/[\u0600-\u06ff]/u.test(query);
 if(!shownRows.length){results.innerHTML="<div class=\"empty\"><strong>برای این جست‌وجو مدخلی پیدا نشد.</strong><div class=\"empty-samples\">عبارت کوتاه‌تری را امتحان کنید یا فیلترها را پاک کنید.</div></div>";}
 else{
  const order=["direct","reference","all"],labels={direct:"برابرهای مصوب",reference:"سرنام‌ها و ارجاع‌ها",all:"مدخل‌ها"};
  const grouped=new Map();for(const row of shownRows){if(!grouped.has(row.matchType))grouped.set(row.matchType,[]);grouped.get(row.matchType).push(row);}
  results.innerHTML=order.filter(k=>grouped.has(k)).map(k=>"<section class=\"result-group\"><h2 class=\"result-group-title\">"+labels[k]+": "+fa(groups[k]??grouped.get(k).length)+" مدخل</h2><div class=\"result-group-items\">"+(k==="direct"?groupExact(grouped.get(k),query,isEnglish):grouped.get(k).map(r=>card(r.entry,query,isEnglish,r.matchType)).join(""))+"</div></section>").join("");
 }
 const pages=Math.max(1,Math.ceil(total/30));pageText.textContent=total?fa(page+1)+" از "+fa(pages):"";prev.disabled=page<=0;next.disabled=page>=pages-1;
}
function search(){if(!ready)return;const id=++requestId;clearTimeout(timer);timer=setTimeout(()=>worker.postMessage({type:"search",id,query:q.value,volume:volume.value,subject:subject.value,exactOnly:exactOnly.checked,page}),170);}
worker.onmessage=event=>{const m=event.data||{};if(m.type==="progress")results.innerHTML="<div class=\"empty\">"+esc(m.message)+"</div>";if(m.type==="ready"){
 indexedBases=new Set(m.indexedBases||[]);
 subjectLabels=m.subjectLabels||{};
 ready=true;
 for(const n of m.volumes){const o=document.createElement("option");o.value=String(n);o.textContent="دفتر "+fa(n);volume.appendChild(o);}
 for(const s of m.subjects){const o=document.createElement("option");o.value=s.value;o.textContent=s.label.replace(/^\[|\]$/g,"");subject.appendChild(o);}
 results.innerHTML="";
